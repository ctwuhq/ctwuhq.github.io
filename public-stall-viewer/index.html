<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>B1攤位每日公告</title>
  <script src="js/config.js"></script>
  <script>
    // 預先載入字體縮放比例，避免畫面閃爍
    (function () {
      const savedZoom = localStorage.getItem("font-zoom") || "1";
      document.documentElement.setAttribute("data-zoom", savedZoom);
      document.documentElement.style.setProperty("--zoom-factor", savedZoom);
    })();
  </script>
  <script>
    // Google Analytics — 動態載入，由 config.js 的 GA_ID 決定
    if (typeof CONFIG !== "undefined" && CONFIG.GA_ID) {
      var _s = document.createElement("script");
      _s.async = true;
      _s.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.GA_ID;
      document.head.appendChild(_s);
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", CONFIG.GA_ID);
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header class="header">
    <h1>🏪 B1 攤位今日公告</h1>
    <nav class="date-nav" aria-label="日期切換">
      <button id="btn-prev" class="nav-btn" aria-label="前一天" disabled>◀</button>
      <span id="current-date" class="date-display">載入中…</span>
      <span id="date-badge" class="badge"></span>
      <button id="btn-next" class="nav-btn" aria-label="後一天" disabled>▶</button>
    </nav>
    <div id="updated-time" class="updated-time"></div>
    <div class="view-tabs">
      <button id="tab-map"    class="tab-btn active" aria-pressed="true">🗺 地圖</button>
      <button id="tab-list"   class="tab-btn"        aria-pressed="false">☰ 列表</button>
      <button id="tab-search" class="tab-btn"        aria-pressed="false">🔍 搜尋</button>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner" hidden aria-live="polite">
    ⚠️ 目前離線，顯示的是快取資料，非即時。
  </div>

  <div id="update-banner" class="update-banner" hidden aria-live="polite">
    🆕 網頁已更新！<button id="update-reload-btn">立即重新整理</button>
  </div>

  <div id="loading" class="loading" aria-live="polite">
    <div class="spinner" role="status"><span class="sr-only"></span></div>
  </div>

  <main id="booth-list"   class="booth-list"   aria-label="攤位列表" hidden></main>
  <main id="booth-map"    class="booth-map"    aria-label="攤位地圖"></main>
  <main id="booth-search" class="booth-search" aria-label="廠商搜尋" hidden></main>

  <!-- 字體大小調整懸浮視窗 -->
  <div class="zoom-widget-container" id="zoom-widget">
    <button class="zoom-widget-trigger" id="zoom-trigger" aria-label="調整字體大小" aria-expanded="false" aria-haspopup="true">
      Aa
    </button>
    <div class="zoom-widget-panel" id="zoom-panel" hidden>
      <div class="zoom-panel-title">字體大小</div>
      <div class="zoom-panel-options">
        <button class="zoom-panel-btn" data-zoom="1" aria-label="標準字體">標準</button>
        <button class="zoom-panel-btn" data-zoom="1.3" aria-label="放大字體">放大</button>
        <button class="zoom-panel-btn" data-zoom="1.6" aria-label="特大字體">特大</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Service Worker 註冊與更新通知
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then((reg) => {
        // 偵測到有新版 SW 正在等待 → 立即激活
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "activated") {
              // 新 SW 激活後顯示提示（已由 SW postMessage 處理）
            }
          });
        });
      });

      // 接收 SW 發送的「有新版本」訊息
      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data && event.data.type === "SW_UPDATED") {
          const banner = document.getElementById("update-banner");
          if (banner) banner.hidden = false;
        }
      });
    }

    document.getElementById("update-reload-btn")?.addEventListener("click", () => {
      window.location.reload();
    });
  </script>
</body>
</html>
